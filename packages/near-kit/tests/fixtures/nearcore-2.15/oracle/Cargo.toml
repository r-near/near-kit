# Writes ../near-primitives-fuzz.json: random external calls encoded and
# hashed by nearcore 2.15.0-rc.1's own near-primitives (0.39.0-rc.1), and
# mutated encodings with nearcore's decode verdict. near-kit's unit tests
# check that its codec agrees on every one.
#
#     cargo run --release > ../near-primitives-fuzz.json
[package]
name = "near-kit-ecc-oracle"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
near-primitives = "=0.39.0-rc.1"
borsh = "1"
serde_json = "1"
